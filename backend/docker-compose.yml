version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: aoseminte_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superparola
      POSTGRES_DB: aoseminte
    ports:
      - "5432:5432"
    volumes:
      - ./aoseminte_data:/var/lib/postgresql/data
    networks:
      - aoseminte_net

networks:
  aoseminte_net:
